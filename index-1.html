<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="icon" type="icon" href="./img/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="card">
        <form id="age-form" novalidate>
            <div class="input-container">
                <div class="input-group">
                    <label for="day">Day</label>
                    <input type="number" id="day" placeholder="DD" min="1" max="31">
                    <span class="error-message"></span>
                </div>

                <div class="input-group">
                    <label for="month">Month</label>
                    <input type="number" id="month" placeholder="MM" min="1" max="12">
                    <span class="error-message"></span>
                </div>

                <div class="input-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" placeholder="YYYY">
                    <span class="error-message"></span>
                </div>
            </div>

            <div class="divider-container">
                <hr class="line">
                <button type="submit" class="submit-btn" aria-label="Calcular Idade">
                    <img src="./img/icon-arrow.svg" alt="Seta para calcular">
                </button>
            </div>
        </form>

        <!-- Zona dos Resultados-->

        <div class="result-container">
            <p class="result-item"><span id="result-years">--</span> years</p>
            <p class="result-item"><span id="result-months">--</span> months</p>
            <p class="result-item"><span id="result-days">--</span> days</p>
        </div>
    </main>

    <script src="./script.js"></script>
    
</body>
</html>
